{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<article class="page{% if is_legal %} page--legal{% endif %}">
  {% if not page.has_hero %}
  <header class="page-header">
    <h1>{{ page.title }}</h1>
  </header>
  {% endif %}
  {% include_block page.body %}
</article>
{% endblock %}
