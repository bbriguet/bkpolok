      services:
        - title: "Medical Affairs Strategy & Team Leadership"
          text: "Building and scaling regional medical affairs functions — most recently taking Santen's team from two people to eleven across five markets."
        - title: "Product Launch & Lifecycle Leadership"
          text: "Regional launch readiness and execution — most recently Roclanda, Catiolanze, Ryjunea and Verkazia — from evidence generation through affiliate rollout."
        - title: "Scientific & Publication Strategy"
          text: "Co-developing publication plans and translating clinical evidence into medical strategy, materials and training that cross-functional teams can actually use."
        - title: "KOL & Patient-Centric Programs"
          text: "Advisory boards and investigator meetings, plus programs I've built from scratch — Fit & Fun for rheumatology patients at UCB, Save the Case at Allergan."
        - title: "Bench-to-Bedside Translation"
          text: "A PhD and postdoc career in zebrafish genetics and hereditary eye disease that still shapes how I read a clinical dossier."
        - title: "Multi-Market, Multilingual Coverage"
          text: "Nordics, UK & Ireland, DACH, Middle East and interim France, worked in five languages rather than through a translator."
      offer:
        lead: "Also available on a freelance or interim basis, across three kinds of engagement:"
        items:
          - title: "Medical Affairs Consulting"
            text: "Project-based support with launch readiness, KOL engagement or publication strategy for teams that need senior medical affairs expertise without a full-time hire."
          - title: "Patient Programs & Advocacy"
            text: >-
              Designing and running patient-facing initiatives — awareness days, peer-support and
              physical-activity programs, patient-story campaigns — in the spirit of Kids Day,
              Fit & Fun and “No Limits: The Story of Roland.” I also support patient-led
              initiatives directly — structure, ideas, project management — alongside the
              patients and associations driving them.
          - title: "Coaching"
            text: "One-to-one coaching for medical affairs professionals building a career in the field, and for managers leading their first team or launch."

