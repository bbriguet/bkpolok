    hero:
      eyebrow: "Medical Affairs Leadership — Multiple Therapeutic Areas"
      h1:
        first_name: "Bożena"
        last_name: "Polok"   # rendered in italic, accent colour
      role: "15 years in medical affairs, built on a research career at the bench."
      status_badge: "Currently at Santen · open to hearing about senior medical affairs opportunities"
      thesis: >-
        I trained as a geneticist studying zebrafish models of eye disease, then spent 15 years
        building medical affairs functions across Europe — in immunology, rheumatology and
        gastroenterology at UCB, established products in hematology, nephrology and pain at
        Sanofi, eye care at Allergan — retina and glaucoma — and now ophthalmology at Santen,
        with a focus on glaucoma, dry eye and myopia. The same thread runs through all of it:
        curiosity, the courage to step outside my comfort zone, and keeping people at the
        center of the science.
      buttons:
        - { label: "Get in touch", href: "#contact", variant: primary }
        - { label: "LinkedIn ↗", href: "https://www.linkedin.com/in/dr-bozena-p-4666053", variant: ghost, external: true }
        - { label: "See publications", href: "#publications", variant: ghost }
      image_alt: "Portrait of Bożena Polok"

    about:
      id: about
      eyebrow: "About"
      h2: "From a zebrafish lab in Sion to medical affairs across five regions"
      paragraphs:
        - >-
          I grew up moving between countries — my parents were both nuclear physicists — living
          in the Netherlands and Switzerland before eight years in Germany and, for the past two
          decades, Switzerland again. At 13, a book about genetics decided the rest: I wanted to
          work on hereditary disease, and by the time I finished a biotechnology degree at the
          Jagiellonian University in Kraków I was already looking for lab benches wherever I
          could find them.
        - >-
          My PhD in Molecular and Developmental Biology (University of Freiburg) took me through
          cancer research in Marburg and molecular cardiology in Frankfurt before I found the
          model that held my attention: zebrafish. In 2006, Prof. Daniel Schorderet invited me to
          the Institut de Recherche en Ophtalmologie in Sion to build one of Switzerland's first
          zebrafish labs and lead my own research group on hereditary eye disease — work that
          produced the papers below, and, in time, a TSR interview and national press coverage.
        - >-
          Industry found me almost by accident, through a microscopy role at Olympus Suisse in
          2011. Fifteen years on — after Medical Science Liaison and medical manager roles
          spanning immunology, rheumatology and gastroenterology at UCB, and established products
          in hematology, nephrology and pain at Sanofi, then a senior advisor post in eye care at
          Allergan (AbbVie) — I lead Medical Affairs at Santen across the Nordics, UK & Ireland,
          DACH and the Middle East, with interim responsibility for France. I've grown that team
          from two people to eleven, managing a multi-million-euro budget behind four product
          launches.
        - "Swiss and Polish, I work across five languages."
      languages: ["Polski", "Français", "English", "Deutsch", "Italiano"]
      languages_caption: "Polish (mother tongue) · French & English (full professional) · German (full professional) · Italian (intermediate)"

    pull_quote:
