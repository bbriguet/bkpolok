          - "Immunology"
          - "Rheumatology"
          - "Gastroenterology"
          - "Hematology"
          - "Nephrology"
          - "Pain"
        cards:
          - icon: compass
            title: "Strategy & team leadership"
            text: "Building and scaling regional medical affairs functions — most recently growing a team from two people to eleven."
          - icon: document
            title: "Launches & lifecycle"
            text: "Four recent ophthalmology launches in glaucoma, dry eye and pediatric myopia, one of them global — from evidence generation to affiliate rollout."
          - icon: chat
            title: "Scientific & publication strategy"
            text: "Publication plans, and turning clinical evidence into strategy, materials and training that cross-functional teams can actually use."
          - icon: network
            title: "KOLs & patients"
            text: "Advisory boards that lead to publications, plus programs built from scratch: Fit & Fun at UCB, Save the Case at Allergan, Kids Day at Santen."
          - icon: flask
            title: "Bench-to-bedside thinking"
            text: "A research career in zebrafish genetics and hereditary eye disease that still shapes how I read a clinical dossier."
          - icon: globe
            title: "Many markets, five languages"
            text: "Nordics & Baltics, UK & Ireland, DACH, the Middle East and France — worked in Polish, French, English, German and Italian rather than through a translator."
      cta:
        text: "Planning a launch, an advisory board or a patient initiative?"
        button: { label: "Let's talk", href: "#contact", variant: primary }

