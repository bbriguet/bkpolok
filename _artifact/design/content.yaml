    personal:
      id: personal
      eyebrow: "Off the clock"
      h2: "What the bench, the barre and the microscope have in common"
      lede: "All are, in their own way, an exercise in close attention — to a specimen, a frame, a pattern of movement, or a student's next step."
      image_alt: "Bożena Polok"
      cards:
        - title: "Zebrafish & genetics"
          text: "The model that decided my scientific path after I wrote, unannounced, to Prof. Wolfgang Driever's lab in Freiburg. I went on to lead my own zebrafish research group at the IRO in Sion, and was selected as one of twelve scientists worldwide for the Marine Biological Laboratory's zebrafish course in Woods Hole."
        - title: "Microscopy"
          text: "What started as a job at Olympus Suisse became a lasting fascination: I collect historical microscopes, keep a small private lab, and ran hands-on microscopy workshops for primary-school children between 2016 and 2022, introducing them to biology through live zebrafish embryos."
        - title: "Ballet"
          text: "Professional ballet school alongside my science baccalaureate — a qualification that also covered dance pedagogy, ethnography and costume history. I taught ballet to children and performed for several years in semi-professional companies; it's where I first learned that discipline and repetition get you to ambitious goals."
        - title: "Photography"
          text: "A surprising gift from my Olympus years — colleagues there taught me to shoot on Olympus cameras, and the habit of composing a frame stayed with me long after I left the company."
        - title: "Mentoring"
          wide: true
          text: "I mentor students exploring a path into biology, genetics or medicine — the same encouragement I once got from a book at 13, and later from Professor Driever, who spent nearly an hour on the phone with a stranger asking about zebrafish."
      asides:
        - "I'm also a volunteer ski guide with GRSA, a Swiss Romandy group for skiers who are blind or have low vision. Many of the people I've guided have become friends — they say I simply lend them my eyes; in return, they've taught me at least as much about courage and trust."
        - "I've also run simple microscopy sessions for school classes in past years — an hour of discovering the world from a different angle: how light behaves, what a leaf or a piece of fabric looks like up close, the textures hiding in ordinary things. If your child's school is looking for something like it, I'm happy to run another one."

