    personal:
      id: personal
      eyebrow: "Off the clock"
      h2: "What the bench, the barre and the microscope have in common"
      lede: "All are, in their own way, an exercise in close attention — to a specimen, a frame, a pattern of movement, or a student's next step."
      image:
        file: ski-guide-matterhorn.jpg
        alt: "Bożena smiling over her shoulder in her red guide jacket and white ski helmet, among fellow volunteer guides in matching red GUIDE jackets, with the Matterhorn rising behind them."
      cards:
        - icon: fish
          title: "Zebrafish & genetics"
          text: "The model that set my scientific path, after an unannounced letter to Prof. Wolfgang Driever's lab in Freiburg. It led to my own research group in Sion and a place on the selective zebrafish course at Woods Hole."
        - icon: target
          title: "Microscopy"
          text: "A job at Olympus Suisse turned into a lasting fascination. Today I collect historical microscopes and keep a small private lab of my own, still happiest when there is something new to look at up close."
        - icon: ballet
          title: "Ballet"
          text: "Professional ballet school alongside my science baccalaureate, then teaching children and performing with semi-professional companies. Dance was my passion and my way of expressing myself — the natural counterweight to demanding analytical work."
        - icon: camera
          title: "Photography"
          text: "A surprising gift from my Olympus years — colleagues there taught me to shoot on Olympus cameras, and the habit of composing a frame stayed with me long after I left the company."
        - icon: flame
          title: "Mentoring"
          wide: true
          text: "I mentor students exploring a path into biology, genetics or medicine — the same encouragement I once got from a book at 13, and later from Professor Driever, who spent nearly an hour on the phone with a stranger asking about zebrafish."
      gallery:
        h3: "Through my lens"
        note: "All photographs © Bożena Polok. All rights reserved — no reuse without written permission."
        images:
          - file: lens-alpine-valley.jpg
            alt: "Late-day sun breaking through storm clouds over a wide Alpine valley, with a flowering silk tree and palm in the foreground."
          - file: lens-mountain-lake.jpg
            alt: "A high mountain lake cradled between rocky slopes under a towering white cloud, with wild alpine thistles in the foreground."
          - file: lens-lake-willows.jpg
            alt: "A calm lake reflecting a line of trees, framed by hanging willow branches, with a distant snow-capped summit on the horizon."
          - file: lens-savanna-tree.jpg
            alt: "A single broad tree standing alone on golden savanna grass beneath a sky full of white clouds."
          - file: lens-saint-bernard.jpg
            alt: "Extreme close-up of a sleeping Saint Bernard: closed eyes, a glistening black nose and the tip of a pink tongue."
          - file: lens-hippos.jpg
            alt: "A pod of hippos resting together in the water, heads stacked against one another, eyes half closed."
      asides:
        - title: "Lending my eyes on the slopes"
          text: "As a volunteer guide with GRSA, a Swiss Romandy group for skiers who are blind or have low vision. Many of the skiers I've guided have become friends; they've taught me at least as much about courage and trust."
        - title: "Microscopy for school classes"
          text: "Between 2016 and 2022, primary-school classes spent an hour with me looking at the world from a different angle: how light behaves, what a leaf or a piece of fabric looks like up close, live zebrafish embryos. Schools interested in a session are welcome to get in touch."

