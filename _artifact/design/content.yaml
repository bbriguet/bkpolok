    intro_html: "<p><i>Applies under the Swiss Federal Act on Data Protection (FADP) and, where applicable, the EU General Data Protection Regulation (GDPR). Last updated: October 2026.</i></p>"
    sections:
      - h3: "1. Who is responsible"
        paragraphs_html:
          - '<p>Dr. Bożena Karolina Polok, address as in the legal notice above, <a href="mailto:bozena@bkpolok.com">bozena@bkpolok.com</a>. Please contact me with any question about your personal data.</p>'
      - h3: "2. In short"
        paragraphs_html:
          - "<p>This website uses no cookies, no analytics, no advertising and no tracking. It loads no fonts, videos or other content from third-party servers. I only process personal data that is technically necessary to show you the site, or that you choose to send me.</p>"
      - h3: "3. Visiting the website (hosting)"
        paragraphs_html:
          - "<p>The website is hosted by [TODO: name and country of the hosting provider]. When you visit, the hosting server automatically records technical data such as your IP address, the date and time, the page requested, and your browser and operating system. This is needed to deliver the website and keep it secure (legal basis under the GDPR: legitimate interest, Art. 6(1)(f)). These logs are deleted after [TODO: retention period, e.g. 14 days] unless needed to investigate a security incident.</p>"
      - h3: "4. Display settings stored on your device"
        paragraphs_html:
          - "<p>If you change text size, contrast or dark mode, your choice is saved in your own browser's local storage so the page remembers it. This information stays on your device, is never sent to me and can be deleted at any time through your browser settings.</p>"
      - h3: "5. Contacting me"
        paragraphs_html:
          - "<p>If you email me, I use your name, email address and message only to answer you and, if we work together, to prepare and carry out our engagement (GDPR Art. 6(1)(b) and (f)). I keep this correspondence as long as needed for that purpose, and business records for as long as the law requires (in Switzerland generally ten years). My email is provided by [TODO: email provider].</p>"
      - h3: "6. Links to other websites"
        paragraphs_html:
          - "<p>Links to LinkedIn, PubMed and media websites open those sites only when you click them. From then on, their own privacy policies apply.</p>"
      - h3: "7. Sharing and transfers abroad"
        paragraphs_html:
          - "<p>I do not sell or rent personal data. Data is shared only with the service providers named above, and only as far as necessary. If a provider processes data outside Switzerland or the EU/EEA, this happens only where the destination ensures adequate protection or appropriate safeguards are in place, such as the European Commission's standard contractual clauses.</p>"
      - h3: "8. Your rights"
        paragraphs_html:
          - "<p>You have the right to request access to your personal data, and to have it corrected or deleted. Under the GDPR you also have the rights to restrict or object to processing and to data portability. To use these rights, email me. You may also complain to a data protection authority: in Switzerland, the Federal Data Protection and Information Commissioner (FDPIC); in the EU, the supervisory authority of your country of residence.</p>"
      - h3: "9. Changes"
        paragraphs_html:
          - "<p>I may update this statement when the website or the law changes. The current version is always published here.</p>"
