    about:
      id: about
      eyebrow: "About"
      h2: "From a zebrafish lab in Sion to medical affairs across Europe"
      figure:
        title: "The zebrafish eye, two ways"
        caption: "Left: the developing eye under the light microscope. Right: a stained section showing the layered retina around the lens. Both from my research years on hereditary eye disease."
        images:
          - file: zebrafish-eye-light-microscope.jpg
            alt: "Light-microscope view of a developing zebrafish eye: a dark, pigmented ring of retina curving around the round lens, in warm amber and red tones."
          - file: zebrafish-eye-stained-section.jpg
            alt: "Stained tissue section through a zebrafish eye in shades of blue: the retina's layers of tightly packed cells form concentric arcs around the lens on the right."
      paragraphs:
        - "I grew up moving between countries — my parents were both nuclear physicists — living in the Netherlands and Switzerland, then eight years in Germany and, for the past two decades, Switzerland again."
        - "At 13, a book about genetics decided the rest: I wanted to work on hereditary disease. By the end of my biotechnology degree at the Jagiellonian University in Kraków, I was already looking for lab benches wherever I could find them."
        - "My PhD (University of Freiburg) took me through cancer research and molecular cardiology before I found the model that held my attention: zebrafish. In 2006, Prof. Daniel Schorderet invited me to Sion to build one of Switzerland's first zebrafish labs and lead my own research group on hereditary eye disease."
        - "Industry found me almost by accident, through a microscopy role at Olympus Suisse in 2011. Medical roles at UCB, Sanofi and Allergan (AbbVie) followed, across immunology, hematology, nephrology, pain and eye care."
        - "Today I lead Medical Affairs at Santen across the Nordics & Baltics, UK & Ireland, DACH and the Middle East, and recently covered France on a four-month interim mission. Alongside that, I'm Santen's Patient Ambassador for EMEA, leading myopia initiatives with local patient organizations."
        - "Swiss and Polish, I work across five languages."
      languages_caption: "Polish (mother tongue) · French & English (full professional) · German (full professional) · Italian (intermediate)"
      # Not displayed by the artifact; kept as the native names of the Language records.
      languages: ["Polski", "Français", "English", "Deutsch", "Italiano"]

    pull_quote:
      text: "“Whenever I found out anything remarkable, I have thought it my duty to put down my discovery on paper, so that all ingenious people might be informed thereof.”"
      cite: "— Antonie van Leeuwenhoek, microscopist, letter of 12 June 1716"
      note: "Curiosity, then the duty to share what you find: a microscopist's creed three centuries ago, and still the heart of good medical affairs."

    services:
      id: services
      eyebrow: "Services"
      h2: "How I can help"
      lede: "Three ways to work together, each built on what I've done in-house across seven therapeutic areas."
      offers:
