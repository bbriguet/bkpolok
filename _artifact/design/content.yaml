          text: "Project-based or interim support with launch readiness, medical plans, advisory boards, KOL engagement and publication strategy — senior expertise without a full-time hire."
        - title: "Patient programs & advocacy"
          text: "Designing and running patient-facing initiatives — awareness days, peer-support and physical-activity programs, patient-story campaigns — and supporting patient-led initiatives with structure, ideas and project management, alongside the associations driving them."
        - title: "Coaching"
          text: "One-to-one coaching for medical affairs professionals building a career in the field, and for managers leading their first team, launch or advisory board."
      what_i_bring:
        h3: "What I bring"
