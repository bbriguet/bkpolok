{# Vignette ronde. image : rendition (url, width, height) · alt · caption · link_url, link_label, external #}
<figure class="research-thumb">
  <img src="{{ image.url }}" width="{{ image.width }}" height="{{ image.height }}" alt="{{ alt }}" loading="lazy">
  {% if caption or link_url %}
  <figcaption>{{ caption }}{% if link_url %} <a href="{{ link_url }}"{% if external %} target="_blank" rel="noopener"{% endif %}>{{ link_label }} <span aria-hidden="true">→</span>{% if external %}<span class="visually-hidden">(opens in a new tab)</span>{% endif %}</a>{% endif %}</figcaption>
  {% endif %}
</figure>
