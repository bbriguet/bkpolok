{# Portrait rond dans un anneau SVG. portrait : rendition (url, width, height) · alt.
  Volontairement sans loading="lazy" : c'est l'image du premier écran (LCP). #}
<div class="iris">
  <svg width="374" height="374" viewBox="0 0 168 168" fill="none" aria-hidden="true" focusable="false">
    <circle cx="84" cy="84" r="82" stroke="var(--line-strong)" stroke-width="1"/>
    <circle cx="84" cy="84" r="64" stroke="var(--accent)" stroke-width="1.2"/>
    <g stroke="var(--accent-2)" stroke-width="1.2">
      <line x1="84" y1="2" x2="84" y2="18"/>
      <line x1="84" y1="150" x2="84" y2="166"/>
      <line x1="2" y1="84" x2="18" y2="84"/>
      <line x1="150" y1="84" x2="166" y2="84"/>
    </g>
  </svg>
  <img src="{{ portrait.url }}" width="{{ portrait.width }}" height="{{ portrait.height }}" alt="{{ alt }}">
</div>
